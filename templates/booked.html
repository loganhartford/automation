<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .container { max-width: 460px; width: 100%; text-align: center; }
        .check-circle {
            width: 64px;
            height: 64px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
        }
        h1 { font-size: 1.7rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 28px; }
        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px 24px;
            text-align: left;
            margin-bottom: 16px;
        }
        .row {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding: 13px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .row:last-child { border-bottom: none; }
        .row-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            min-width: 72px;
            flex-shrink: 0;
        }
        .row-value { font-size: 0.95rem; color: #1e293b; }
        .invite-note {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.875rem;
            color: #0c4a6e;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="check-circle">
        <svg width="30" height="30" fill="none" viewBox="0 0 24 24" stroke="#16a34a" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
    </div>
    <h1>You're booked!</h1>
    <p class="subtitle">See you soon, {{ name }}.</p>

    <div class="card">
        <div class="row">
            <span class="row-label">Date</span>
            <span class="row-value">{{ start_dt.strftime('%A, %B %-d, %Y') }}</span>
        </div>
        <div class="row">
            <span class="row-label">Time</span>
            <span class="row-value">{{ start_dt.strftime('%-I:%M %p') }} – {{ end_dt.strftime('%-I:%M %p') }} PT</span>
        </div>
        <div class="row">
            <span class="row-label">Duration</span>
            <span class="row-value">30 minutes</span>
        </div>
        <div class="row">
            <span class="row-label">Invite</span>
            <span class="row-value">{{ email }}</span>
        </div>
    </div>

    <p class="invite-note">
        A calendar invite has been sent to <strong>{{ email }}</strong>. Check your inbox.
    </p>
</div>
</body>
</html>
